name: Noxara CI
on:
  push:
    branches: [main, feat/sky-identification]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npm run build

